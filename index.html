<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLANTIS // SECURE TERMINAL v4.0</title>
    <style>
        :root {
            --glow: #ffffff;       /* Чистый белый текст */
            --bg: #000000;         /* Absolute чёрный фон */
            --bg-panel: #000000;   /* Полностью чёрная внутренняя часть панели */
            --err: #ff1111;        
            --acc: #ffffff;        /* Успешные логи тоже белые */
        }
        body.alarm {
            --glow: #ff1111;
            --bg-panel: #000000;
        }
        body {
            background-color: var(--bg);
            color: var(--glow);
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: 600;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }
        body::before, body::after {
            content: " ";
            display: block;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(255, 255, 255, 0.02) 50%, rgba(0, 0, 0, 0.5) 50%), linear-gradient(90deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0), rgba(255, 255, 255, 0.02));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        body::after {
            background: linear-gradient(rgba(0, 0, 0, 0) 90%, rgba(255, 255, 255, 0.04) 95%, rgba(0, 0, 0, 0) 100%);
            background-size: 100% 300%;
            animation: scanline 8s linear infinite;
            z-index: 1000;
        }
        body.alarm::after {
            background: linear-gradient(rgba(0, 0, 0, 0) 90%, rgba(204, 0, 0, 0.04) 95%, rgba(0, 0, 0, 0) 100%);
            background-size: 100% 300%;
        }
        @keyframes scanline {
            0% { background-position: 0 -300%; }
            100% { background-position: 0 300%; }
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-4px, 2px); }
            40%, 80% { transform: translate(4px, -2px); }
        }
        .shake {
            animation: shake 0.2s ease-in-out 2;
        }
        .terminal-box {
            width: 100%;
            max-width: 850px;
            height: 85vh; 
            background: var(--bg-panel);
            border: 2px solid var(--glow); 
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            position: relative;
            transition: border 0.3s;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            color: var(--glow);
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 15px;
            margin-bottom: 20px;
            font-weight: bold;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-shrink: 0;
        }
        .hub-logo {
            display: block;
            max-width: 150px;
            height: auto;
            margin: 0 auto 15px auto;
            opacity: 0.95;
            pointer-events: none;
            filter: brightness(0) invert(1); 
        }
        /* Внутреннее независимое окно скролла логов */
        #out {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 8px;
            margin-bottom: 15px;
        }
        #out::-webkit-scrollbar { width: 4px; }
        #out::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        #out::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 2px; }

        .line {
            line-height: 1.6;
            margin-bottom: 8px;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .input-line {
            display: flex;
            align-items: center;
            margin-top: auto; 
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        .input-line.active {
            opacity: 1;
            visibility: visible;
        }
        .prompt {
            margin-right: 12px;
            color: var(--glow);
            font-weight: bold;
            flex-shrink: 0;
            letter-spacing: 1px;
        }
        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: text;
            width: 100%;
        }
        .custom-view {
            color: #ffffff;        
            font-family: inherit;
            font-size: inherit;
            white-space: pre-wrap;
            display: inline-flex;
            align-items: center;
        }
        .custom-view::after {
            content: '_';
            margin-left: 3px;
            color: var(--glow);
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .error { color: var(--err); font-weight: bold; }
        .success { color: var(--acc); font-weight: bold; }
        .gray { color: rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body>

let step = 'login', isMask = false, gameInterval = null, stage = 0, targetWord = "", wordTimer = null;

const CRYPTO_KEYS = ["ATL-4091", "ATL-1182", "ATL-7634", "ATL-9901", "ATL-2543"];
const delay = ms => new Promise(r => setTimeout(r, ms));
let audioCtx = null;

function playBeep(f, t, d) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        osc.type = t; osc.frequency.value = f; 
        g.gain.setValueAtTime(0.015, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
        osc.connect(g); g.connect(audioCtx.destination); 
        osc.start(); osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}
function addLine(txt, cls = "") {
    const d = document.createElement('div'); d.className = `line ${cls}`; d.textContent = txt; 
    DOM.out.appendChild(d); DOM.out.scrollTop = DOM.out.scrollHeight; return d;
}
async function type(txt, cls = "") {
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        d.textContent += txt.charAt(i); 
        if (Math.random() > 0.3) playBeep(840, 'square', 0.015); 
        await delay(CFG.SPD);
    }
}
async function runBootLogs() {
    DOM.out.innerHTML = "";

    for (let i = 0; p.length > i; i++) {
        await delay(60 + Math.random() * 60); 
        addLine("[DEBUG] " + Math.floor(Math.random() * p.length) + "| " + p[i], 'gray'); 
    }
    await delay(300); 
    await type("SYS: FOR ACCESS ENTRY - SUBMIT AUTH KEY OR EMPLOYEE ID.", "gray");
    await type("SYS: STANDING BY...", "success"); 
    ask('AGENT ID / EMPLOYEE:', 'login', false);
}
function ask(p, s, m) { 
    step = s; isMask = m; DOM.pr.textContent = p; DOM.inp.value = DOM.view.textContent = ""; 
    DOM.inp.disabled = false; DOM.blk.classList.add('active'); DOM.inp.focus(); 
}
function err(m) { 
    DOM.term.classList.add('shake'); playBeep(130, 'triangle', 0.35); 
    setTimeout(() => DOM.term.classList.remove('shake'), 400); addLine(m, "error"); 
}
function die(m) { clearTimeout(wordTimer); clearInterval(gameInterval); err(m); setTimeout(() => location.reload(), 2500); }
async function scramblerDie() {
    clearTimeout(wordTimer); clearInterval(gameInterval); DOM.blk.classList.remove('active'); DOM.inp.disabled = true;

    DOM.out.innerHTML = ""; document.getElementById('hd').style.display = 'none';
    playBeep(70, 'sawtooth', 1.5); playBeep(50, 'sawtooth', 1.5); DOM.term.classList.add('shake');
    const errBox = addLine("\n\n\n\n      ███████  ██████  ██████   ██████  ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      █████    ██████  ██████  ██    ██ ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      ███████  ██   ██ ██   ██  ██████  ██   ██ \n\n", "error");
    errBox.style.fontSize = "22px"; errBox.style.textAlign = "center";
    await delay(1000); addLine(">>> КРИТИЧЕСКИЙ СБОЙ ПАМЯТИ: СНОС СИСТЕМЫ...", "error"); await delay(1500); location.reload();
}
async function bar() {

    }
}

    step = 'game'; stage = 0; DOM.out.innerHTML = ""; await type(">>> ИНИЦИАЛИЗАЦИЯ КРИПТОГРАФИЧЕСКОГО АНАЛИЗАТОРА...", "gray");
