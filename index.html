<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLANTIS // CORE DATABASE v1.0</title>
    <style>
        :root {
            --glow: #112233;       /* Тактический стальной тёмно-синий текст */
            --glow-dim: #778899;   /* Серый хаки для рамок */
            --bg: #eef2f5;         /* Светло-серый стерильный фон штаба */
            --bg-panel: #ffffff;   /* Чистый белый цвет коробки дисплея */
            --err: #cc0000;        
            --acc: #0088cc;        /* Синий неон для подтверждённых логов */
        }
        /* Жёсткая No-Scroll фиксация экрана */
        html, body {
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
        }
        body {
            color: var(--glow);
            font-family: 'Courier New', monospace;
            font-size: 16px;       
            font-weight: 700;      
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        body::before, body::after {
            content: " ";
            display: block;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(17, 34, 51, 0.01) 50%, rgba(255, 255, 255, 0.3) 50%), linear-gradient(90deg, rgba(17, 34, 51, 0.01), rgba(0, 0, 0, 0), rgba(17, 34, 51, 0.01));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        body::after {
            background: linear-gradient(rgba(255, 255, 255, 0) 90%, rgba(17, 34, 51, 0.02) 95%, rgba(255, 255, 255, 0) 100%);
            background-size: 100% 300%;
            animation: scanline 6s linear infinite;
            z-index: 1000;
        }
        @keyframes scanline {
            0% { background-position: 0 -300%; }
            100% { background-position: 0 300%; }
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-4px, 1px); }
            40%, 80% { transform: translate(4px, -1px); }
        }
        .shake { animation: shake 0.2s ease-in-out 2; }
        .terminal-box {
            width: 95%;
            max-width: 850px;
            height: 90vh; 
            background: var(--bg-panel);
            border: 2px solid var(--glow-dim); 
            border-radius: 4px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08), inset 0 0 20px rgba(0,0,0,0.02);
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            color: var(--glow);
            border-bottom: 2px solid rgba(17, 34, 51, 0.15);
            padding-bottom: 15px;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-shrink: 0; 
        }
        .hub-logo {
            display: block;
            width: 150px;           
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 auto 10px auto; 
            opacity: 0.95;
            pointer-events: none;
        }
        /* Внутреннее независимое окно вывода логов */
        #out {
            flex-grow: 1; 
            overflow-y: auto; 
            padding-right: 8px;
            margin-bottom: 15px;
        }
        #out::-webkit-scrollbar { width: 4px; }
        #out::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); }
        #out::-webkit-scrollbar-thumb { background: var(--glow-dim); border-radius: 2px; }

        .line {
            line-height: 1.6;
            margin-bottom: 10px;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .input-line {
            display: flex;
            align-items: center;
            margin-top: auto; 
            padding-top: 10px;
            border-top: 1px solid rgba(17, 34, 51, 0.1);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        .input-line.active { opacity: 1; visibility: visible; }
        .prompt {
            margin-right: 12px;
            color: var(--glow);
            font-weight: bold;
            flex-shrink: 0;
            letter-spacing: 1px;
        }
        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: text;
            width: 100%;
        }
        .custom-view {
            color: #112233;        
            font-family: inherit;
            font-size: inherit;
            font-weight: bold;
            white-space: pre-wrap;
            display: inline-flex;
            align-items: center;
        }
        .custom-view::after {
            content: '_';
            margin-left: 4px;
            color: var(--acc);     
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .error { color: var(--err); font-weight: bold; }
        .success { color: var(--acc); font-weight: bold; }
        .gray { color: rgba(17, 34, 51, 0.45); } 
    </style>
</head>
<body>
<div class="terminal-box" id="term">
    <div class="header" id="hd">
        <img src="ART_logo.png" class="hub-logo" alt="ATLANTIS LOGO">
        PMC ATLANTIS // CENTRAL DATABANK CORE SECURITY
    </div>
    <div id="out"></div>
    <div class="input-line" id="blk">
        <span class="prompt" id="pr">ENTER SECURITY LOGIN:</span>
        <div class="input-wrapper">
            <input type="text" id="inp" autocomplete="off" disabled>
            <div class="custom-view" id="view"></div>
        </div>
    </div>
</div>
<script>
const CFG = { 
    USER: "Base",
    PASS: "ATLANTIS111",
    SPD: 15 
};
const DOM = { 
    term: document.getElementById('term'), inp: document.getElementById('inp'), 
    view: document.getElementById('view'), out: document.getElementById('out'), 
    pr: document.getElementById('pr'), blk: document.getElementById('blk') 
};
let step = 'login_user', tempLogin = "", dialogueStage = 0, wordTimer = null;
const delay = ms => new Promise(r => setTimeout(r, ms));
let audioCtx = null;

function playBeep(f, t, d) {
    try {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        osc.type = t; osc.frequency.value = f;
        g.gain.setValueAtTime(0.01, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function addLine(txt, cls = "") {
    const d = document.createElement('div'); d.className = `line ${cls}`; d.textContent = txt;
    DOM.out.appendChild(d); DOM.out.scrollTop = DOM.out.scrollHeight; return d;
}
async function type(txt, cls = "") {
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        d.textContent += txt.charAt(i); playBeep(800, 'sine', 0.015); await delay(CFG.SPD);
    }
}
async function runBootLogs() {
    DOM.out.innerHTML = "";
    const p = [
        "SYNCHRONIZING RECON SAT-LINKS... SUCCESS", 
        "ISOLATING ROUTER GATEWAYS... ACTIVE", 
        "ENFORCING КЕRBEROS FIREWALLS... IMPENETRABLE",
        "CONNECTING TO ATLANTIS MAIN CONSOLE... SECURE"
    ];
    for (let i = 0; i < p.length; i++) {
        await delay(60 + Math.random() * 60); addLine("[ATLANTIS-SEC] | " + p[i], 'gray');
    }
    await delay(300);
    await type("SYS: КОРНЕВАЯ БАЗА ДАННЫХ АТЛАНТИСА ЗАБЛОКИРОВАНА ВЫСШИМ ШИФРОМ.", "gray");
    ask('ENTER SECURITY LOGIN:', 'login_user', false);
}
function ask(p, s, m) { 
    step = s; DOM.pr.textContent = p; DOM.inp.value = DOM.view.textContent = ""; 
    DOM.inp.disabled = false; DOM.blk.classList.add('active'); DOM.inp.focus(); 
}
function err(m) { 
    DOM.term.classList.add('shake'); playBeep(130, 'sawtooth', 0.4); 
    setTimeout(() => DOM.term.classList.remove('shake'), 400); addLine(m, "error"); 
}
async function terminalScramblerDie(m) {
    clearTimeout(wordTimer); DOM.blk.classList.remove('active'); DOM.inp.disabled = true; err(m); await delay(1000);
    DOM.out.innerHTML = ""; playBeep(50, 'sawtooth', 2.0); DOM.term.classList.add('shake');
    const errBox = addLine("\n\n\n\n      ███████  ██████  ██████   ██████  ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      █████    ██████  ██████  ██    ██ ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██████  \n      ███████  ██   ██ ██   ██  ██████  ██   ██ \n\n", "error");
    errBox.style.fontSize = "22px"; errBox.style.textAlign = "center"; await delay(2000); location.reload();
}
async function bar() {
    const d = addLine("", 'success');
    for (let p = 0; p <= 100; p += 5) { 
        d.textContent = `DECRYPTING MAIN FRAME ARTIFACTS: [${"█".repeat(p/5)}${".".repeat(20-(p/5))}] ${p}%`; 
        playBeep(400 + p * 2, 'sine', 0.02); await delay(40); 
    }
}
async function openMainMenu() {
    DOM.out.innerHTML = ""; step = 'main_menu';
    await type("========================================", "gray");
    await type("ACCESS GRANTED // CENTRAL DATABANK OPERATIONAL ENVIRONMENT", "success");
    await type("1. ДЕПАРТАМЕНТЫ КОНТРАКТНИКОВ", "success");
    await type("2. СЕТЕВЫЕ ПРОТОКОЛЫ ОПЕРАТОРОВ (ТОС)", "success");
    await type("3. ЗАКРЫТЬ СЕССИЮ БЕЗОПАСНОСТИ", "success");
    await type("========================================", "gray");
    ask('ENTER COMMAND (1-3):', 'main_menu', false);
}

async function showContractorsMenu() {
    DOM.out.innerHTML = ""; step = 'contractors_menu';
    await type("=== ДЕПАРТАМЕНТЫ КОНТРАКТНИКОВ PMC ATLANTIS ===", "success");
    addLine("1. Служба Безопасности L.a.S Network", "gray");
    addLine("2. Спецотряд SHF (Secret Highly Fighters)", "gray");
    addLine("3. Департамент Re-Union (НИИ Японии)", "success"); // Тот самый запрашиваемый отдел!
    addLine("4. Назад в Главное Меню", "gray");
    ask('ВЫБЕРИТЕ ВЕДОМСТВО (1-4):', 'contractors_menu', false);
}

async function showOperatorsMenu() {
    DOM.out.innerHTML = ""; step = 'operators_menu';
    await type("=== СЕТЕВЫЕ ПРОТОКОЛЫ ОПЕРАТОРОВ (ТОС) ===", "success");
    addLine("1. Лог оператора: BILL [БЛОКИРОВАНО СБ]", "error");
    addLine("2. Лог оператора: SIN [НЕДОСТУПНО]", "gray");
    addLine("3. Назад в Главное Меню", "gray");
    ask('ВЫБЕРИТЕ ОПЕРАТОРА (1-3):', 'operators_menu', false);
}
DOM.inp.oninput = () => { DOM.view.textContent = DOM.inp.value; };
DOM.inp.onkeydown = async (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault(); initAudio(); 

    const v = DOM.inp.value, cv = v.trim(); if (!v) return;
    DOM.blk.classList.remove('active'); DOM.inp.disabled = true; 
    addLine(DOM.pr.textContent + " " + cv, 'success'); await delay(300);
    
    // ВХОД ПО ЛОГИНУ 'Base'
    if (step === 'login_user') {
        if (cv === CFG.USER) {
            tempLogin = cv;
            step = 'login_pass';
            ask('ENTER SECURITY PASSWORD:', 'login_pass', false);
        } else {
            err("INVALID LOGIN INDENTIFIER. SECURITY ALERTED.");
            await delay(1500); ask('ENTER SECURITY LOGIN:', 'login_user', false);
        }
    } 
    // ВХОД ПО ПАРОЛЮ 'ATLANTIS111'
    else if (step === 'login_pass') {
        if (cv === CFG.PASS) {
            await bar(); 
            await openMainMenu();
        } else {
            err("CRITICAL ERROR: INVALID PASSWORD TOKEN. DATA LOCKDOWN.");
            await delay(1500); step = 'login_user'; ask('ENTER SECURITY LOGIN:', 'login_user', false);
        }
    }
    else if (step === 'main_menu') {
        if (cv === '1') showContractorsMenu();
        else if (cv === '2') showOperatorsMenu();
        else if (cv === '3') { 
            DOM.out.innerHTML = ""; step = 'login_user'; 
            ask('ENTER SECURITY LOGIN:', 'login_user', false); 
        }
        else { err("НЕВЕРНАЯ КОМАНДА."); await delay(1000); openMainMenu(); }
    }
    else if (step === 'contractors_menu') {
        if (cv === '4') openMainMenu();
        else if (cv === '1' || cv === '2' || cv === '3') { 
            err("🚨 СИСТЕМА: ДАННЫЕ ДЕПАРТАМЕНТА АРХИВИРОВАНЫ СБ PMC ATLANTIS."); 
            await delay(1500); showContractorsMenu(); 
        } else { err("НЕВЕРНЫЙ ВЫБОР."); await delay(1000); showContractorsMenu(); }
    }
    else if (step === 'operators_menu') {
        if (cv === '3') openMainMenu();
        else { err("ДАННЫЙ КАНАЛ СВЯЗИ ЗАБЛОКИРОВАН ОФИЦЕРОМ БЕЗОПАСНОСТИ."); await delay(1000); showOperatorsMenu(); }
    }
};

document.onclick = () => { initAudio(); if (DOM.inp.disabled === false) DOM.inp.focus(); };
window.onload = () => { runBootLogs(); };
</script>
</body>
</html>
