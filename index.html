<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Access</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
        }
        .terminal {
            max-width: 800px;
            margin: 0 auto;
        }
        .output {
            white-space: pre-wrap;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .input-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            margin-right: 10px;
            user-select: none;
        }
        input {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            outline: none;
            flex-grow: 1;
        }
    </style>
</head>
<body>

<div class="terminal">
    <div class="output" id="output">SYSTEM INITIALIZED...
ACCESS RESTRICTED. PLEASE AUTHENTICATE.</div>
    <div class="input-line">
        <span class="prompt" id="prompt">LOGIN:</span>
        <input type="text" id="commandInput" autofocus autocomplete="off">
    </div>
</div>

<script>
    // НАСТРОЙКИ КРЕДЕНШЕНАЛОВ
    const CORRECT_LOGIN = "admin";
    const CORRECT_PASSWORD = "123";
    const SECRET_LINK = "https://example.com";
    const ERROR_TEXT = "ОШИБКА: Доступ заблокирован. Неверные данные. Попробуйте снова.";

    const input = document.getElementById('commandInput');
    const output = document.getElementById('output');
    const prompt = document.getElementById('prompt');

    // Состояние терминала: 'login' или 'password'
    let currentStep = 'login'; 
    let savedLogin = '';

    // Фокус на поле ввода при клике в любое место
    document.addEventListener('click', () => {
        if (!input.disabled) input.focus();
    });

    // Функция для безопасного экранирования текста пользователя (защита от XSS)
    function escapeHTML(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const value = input.value.trim();
            if (!value) return;

            if (currentStep === 'login') {
                // --- ШАГ 1: ПРОВЕРКА ЛОГИНА ---
                output.innerHTML += `\n\nLOGIN: ${escapeHTML(value)}`;
                
                if (value === CORRECT_LOGIN) {
                    savedLogin = value;
                    output.innerHTML += `\n[SUCCESS] Логин верифицирован.`;
                    
                    // Переключаем интерфейс на ввод пароля
                    currentStep = 'password';
                    prompt.textContent = 'PASSWORD:';
                    input.type = 'password'; // Скрываем вводимые символы звездочками
                } else {
                    output.innerHTML += `\n${ERROR_TEXT}`;
                }
                
            } else if (currentStep === 'password') {
                // --- ШАГ 2: ПРОВЕРКА ПАРОЛЯ ---
                // Выводим маскированный пароль на экран, чтобы не палить его
                output.innerHTML += `\n\nPASSWORD: ${'*'.repeat(value.length)}`;
                
                if (value === CORRECT_PASSWORD) {
                    output.innerHTML += `\n\n[ACCESS GRANTED] Перенаправление...`;
                    input.disabled = true;
                    input.blur();
                    
                    setTimeout(() => {
                        window.location.href = SECRET_LINK;
                    }, 1500);
                } else {
                    output.innerHTML += `\n${ERROR_TEXT}`;
                    
                    // Сбрасываем процесс обратно на ввод логина при ошибке
                    currentStep = 'login';
                    prompt.textContent = 'LOGIN:';
                    input.type = 'text';
                    savedLogin = '';
                }
            }

            // Очищаем поле и скроллим вниз
            input.value = '';
            window.scrollTo(0, document.body.scrollHeight);
        }
    });
</script>

</body>
</html>
