<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLANTIS // STEALTH NET TERMINAL</title>
    <style>
        :root {
            --glow-color: rgba(0, 255, 65, 0.35);
            --text-color: #00ff41;
            --bg-color: #010502;
            --accent-color: #55ff55;
            --error-color: #ff1111;
            --error-glow: rgba(255, 17, 17, 0.5);
            --success-color: #00ffff;
            --success-glow: rgba(0, 255, 255, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            padding: 40px 30px;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            text-shadow: 0 0 4px var(--glow-color);
        }

        /* Эффект мерцания ЭЛТ */
        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 9999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            animation: flicker 0.2s infinite;
        }

        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.85) 100%);
            z-index: 10000;
            pointer-events: none;
        }

        .terminal {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .header-text {
            color: var(--accent-color);
            border-bottom: 2px double var(--text-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            white-space: pre-wrap;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .output-container {
            display: flex;
            flex-direction: column;
        }

        .output-line {
            white-space: pre-wrap;
            line-height: 1.5;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .input-line {
            display: flex;
            align-items: center;
            margin-top: 15px;
        }

        .prompt {
            margin-right: 12px;
            user-select: none;
            font-weight: bold;
            color: var(--accent-color);
            white-space: nowrap;
        }

        input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            outline: none;
            flex-grow: 1;
            text-shadow: 0 0 4px var(--glow-color);
        }

        .error-msg {
            color: var(--error-color);
            text-shadow: 0 0 6px var(--error-glow);
            font-weight: bold;
        }

        .success-msg {
            color: var(--success-color);
            text-shadow: 0 0 6px var(--success-glow);
        }

        .user-input {
            color: #ffffff;
            text-shadow: 0 0 6px rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header-text">======================================================================
  P.M.C. "ATLANTIS" // INFILTRATION & STEALTH OPERATIONS NETWORK
  SECURE NODAL TERMINAL v6.0.0-ALPHA // LEVEL 5 SECURITY OVERLAY
======================================================================</div>
    
    <div class="output-container" id="output"></div>

    <div class="input-line">
        <span class="prompt" id="prompt">ENTER AGENT ID:</span>
        <input type="text" id="commandInput" autofocus autocomplete="off">
    </div>
</div>

<script>
    const CONFIG = {
        LOGIN: "Bill",
        PASSWORD: "324",
        SECRET_URL: "https://google.com",
        TYPE_SPEED: 8 // Быстрая печать для более боевого вида
    };

    const DOM = {
        input: document.getElementById('commandInput'),
        output: document.getElementById('output'),
        prompt: document.getElementById('prompt')
    };

    let currentStep = 'login'; 

    document.addEventListener('click', () => {
        if (!DOM.input.disabled) DOM.input.focus();
    });

    function createLine(text, className = '') {
        const line = document.createElement('div');
        line.className = `output-line ${className}`;
        DOM.output.appendChild(line);
        window.scrollTo(0, document.body.scrollHeight);
        return line;
    }

    function typeText(text, className = '', callback = null) {
        const line = createLine('', className);
        let i = 0;

        function printChar() {
            if (i < text.length) {
                line.textContent += text.charAt(i);
                i++;
                setTimeout(printChar, CONFIG.TYPE_SPEED);
            } else if (callback) {
                callback();
            }
        }
        printChar();
    }

    // Имитация прогресс-бара для шпионского взлома/дешифровки
    function showProgressBar(callback) {
        const line = createLine('', 'success-msg');
        let percent = 0;
        
        function updateBar() {
            if (percent <= 100) {
                const size = 20; // Длина полосы
                const filled = Math.floor((percent / 100) * size);
                const empty = size - filled;
                const bar = '█'.repeat(filled) + '░'.repeat(empty);
                line.textContent = `DECRYPTING STEALTH ARCHIVE: [${bar}] ${percent}%`;
                percent += 4;
                setTimeout(updateBar, 40);
            } else {
                if (callback) callback();
            }
        }
        updateBar();
    }

    // Тексты в стиле скрытной кибер-разведки
    const introLines = [
        "SYS: BOOTING QUANTUM DECRYPTION CORES...",
        "SYS: ESTABLISHING REVERSE PROXY VIA ONION-OVERLAY... [TUNNEL STABLE]",
        "SYS: ANTI-CYBER ATTACK PARANOIA PROTOCOL (CAPP v9) IS ACTIVE.",
        "SYS: PACKET INJECTION COMPLETED. STANDING BY FOR AGENT AUTHENTICATION.\n"
    ];

    function playIntro(index = 0) {
        if (index < introLines.length) {
            typeText(introLines[index], '', () => playIntro(index + 1));
        } else {
            DOM.input.disabled = false;
            DOM.input.focus();
        }
    }

    // Старт
    DOM.input.disabled = true;
    playIntro();

    DOM.input.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;

        const value = DOM.input.value.trim();
        DOM.input.value = '';
        if (!value) return;

        if (currentStep === 'login') {
            createLine(`ENTER AGENT ID: ${value}`, 'user-input');

            if (value.toLowerCase() === CONFIG.LOGIN.toLowerCase()) {
                DOM.input.disabled = true;
                typeText("\n[OK] ИДЕНТИФИКАТОР АГЕНТА НАЙДЕН В СЕТИ. ПРОВЕРКА КРИПТО-ПОДПИСИ...", 'success-msg', () => {
                    currentStep = 'password';
                    DOM.prompt.textContent = 'ENTER CRYPTO-KEY:';
                    DOM.input.type = 'password';
                    DOM.input.disabled = false;
                    DOM.input.focus();
                });
            } else {
                triggerError();
            }
            
        } else if (currentStep === 'password') {
            createLine(`ENTER CRYPTO-KEY: ${'*'.repeat(value.length)}`, 'user-input');
            
            if (value === CONFIG.PASSWORD) {
                DOM.input.disabled = true;
                DOM.input.blur();
                
                typeText("\n[ACCESS GRANTED] ДОСТУП К ОПЕРАТИВНОЙ БАЗЕ ДАННЫХ РАЗРЕШЕН.\n", 'success-msg', () => {
                    showProgressBar(() => {
                        typeText("\nСКАЧИВАНИЕ ДОКУМЕНТОВ ИЗ КОМПЛЕКСА ЗАВЕРШЕНО. ПЕРЕНАПРАВЛЕНИЕ НА ЗАЩИЩЕННЫЙ КАНАЛ...", 'success-msg', () => {
                            setTimeout(() => {
                                window.location.href = CONFIG.SECRET_URL;
                            }, 1200);
                        });
                    });
                });
            } else {
                triggerError();
            }
        }
    });

    function triggerError() {
        DOM.input.disabled = true;
        typeText("\n[WARNING] ОТКАЗ В ДОСТУПЕ. ЗАПУСКАЮ СКРЫТИЕ СЛЕДОВ ТРАФИКА ДЛЯ ХОСТА...\n", 'error-msg', () => {
            currentStep = 'login';
            DOM.prompt.textContent = 'ENTER AGENT ID:';
            DOM.input.type = 'text';
            DOM.input.disabled = false;
            DOM.input.focus();
        });
    }
</script>

</body>
</html>
