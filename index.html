<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P.M.C Atlantis - Secure Terminal</title>
    <style>
        :root {
            --glow-color: rgba(26, 255, 36, 0.4);
            --text-color: #1aff24;
            --bg-color: #030703;
            --accent-color: #88ff88;
            --error-color: #ff3333;
            --error-glow: rgba(255, 51, 51, 0.5);
            --success-color: #33ffff;
            --success-glow: rgba(51, 255, 255, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            padding: 30px;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            text-shadow: 0 0 6px var(--glow-color);
        }

        @keyframes flicker {
            0% { opacity: 0.98; }
            50% { opacity: 1; }
            100% { opacity: 0.99; }
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
            z-index: 9999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
            z-index: 10000;
            pointer-events: none;
        }

        .terminal {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .logo-wrapper {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px auto;
            overflow: hidden;
            position: relative;
        }

        .terminal-logo {
            display: block;
            width: 100%;
            height: auto;
            position: absolute;
            left: -180px;
            filter: drop-shadow(180px 0 0 var(--text-color)) drop-shadow(180px 0 10px var(--glow-color));
            opacity: 0.9;
        }

        .header-text {
            color: var(--accent-color);
            border-bottom: 1px dashed var(--text-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            white-space: pre-wrap;
            text-align: center;
        }

        .output-container {
            display: flex;
            flex-direction: column;
        }

        .output-line {
            white-space: pre-wrap;
            line-height: 1.6;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            word-break: break-all;
        }

        .input-line {
            display: flex;
            align-items: center;
            margin-top: 15px;
        }

        .prompt {
            margin-right: 12px;
            user-select: none;
            font-weight: bold;
            color: var(--accent-color);
            white-space: nowrap;
        }

        input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            outline: none;
            flex-grow: 1;
            text-shadow: 0 0 6px var(--glow-color);
        }

        .error-msg {
            color: var(--error-color);
            text-shadow: 0 0 6px var(--error-glow);
        }

        .success-msg {
            color: var(--success-color);
            text-shadow: 0 0 6px var(--success-glow);
        }

        .user-input {
            color: #ffffff;
            text-shadow: 0 0 6px rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>

<div class="terminal">
    <div class="logo-wrapper">
        <!-- Альтернативный текст убран, чтобы при ошибке загрузки ничего лишнего не рисовалось -->
        <img id="logoImg" class="terminal-logo" src="">
    </div>

    <div class="header-text">===================================================================
  P.M.C. "ATLANTIS" — SECURE DATA NETWORK v5.50
  WARNING: AUTHORIZED MILITARY PERSONNEL ONLY
===================================================================</div>
    
    <div class="output-container" id="output"></div>

    <div class="input-line">
        <span class="prompt" id="prompt">ENTER OPERATOR ID:</span>
        <input type="text" id="commandInput" autofocus autocomplete="off">
    </div>
</div>

<script>
    const CONFIG = {
        LOGIN: "Bill",
        PASSWORD: "324",
        SECRET_URL: "https://google.com",
        TYPE_SPEED: 15,
        // Ипользуем прямую внешнюю ссылку на загруженный прозрачный логотип
        LOGO_FILE: "https://postimg.cc" 
    };

    const DOM = {
        input: document.getElementById('commandInput'),
        output: document.getElementById('output'),
        prompt: document.getElementById('prompt'),
        logo: document.getElementById('logoImg')
    };

    // Устанавливаем прямую ссылку на картинку
    DOM.logo.src = CONFIG.LOGO_FILE;

    let currentStep = 'login'; 

    document.addEventListener('click', () => {
        if (!DOM.input.disabled) DOM.input.focus();
    });

    function createLine(text, className = '') {
        const line = document.createElement('div');
        line.className = `output-line ${className}`;
        DOM.output.appendChild(line);
        return line;
    }

    function typeText(text, className = '', callback = null) {
        const line = createLine('', className);
        let i = 0;

        function printChar() {
            if (i < text.length) {
                line.textContent += text.charAt(i);
                i++;
                window.scrollTo(0, document.body.scrollHeight);
                setTimeout(printChar, CONFIG.TYPE_SPEED);
            } else if (callback) {
                callback();
            }
        }
        printChar();
    }

    const introLines = [
        "INITIALIZING CLIENT DECRYPTION MODULE... [OK]",
        "CONNECTING TO CENTRAL DATABASE... [CONNECTED]",
        "\nACCESS RESTRICTED. IP RECORDED. INTERCEPT PROTOCOL ACTIVE.\n"
    ];

    function playIntro(index = 0) {
        if (index < introLines.length) {
            typeText(introLines[index], '', () => playIntro(index + 1));
        } else {
            DOM.input.disabled = false;
            DOM.input.focus();
        }
    }

    DOM.input.disabled = true;
    playIntro();

    DOM.input.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;

        const value = DOM.input.value.trim();
        DOM.input.value = '';
        if (!value) return;

        if (currentStep === 'login') {
            createLine(`ENTER OPERATOR ID: ${value}`, 'user-input');

            if (value.toLowerCase() === CONFIG.LOGIN.toLowerCase()) {
                DOM.input.disabled = true;
                typeText("\n[SUCCESS] Идентификатор подтвержден. Проверка уровня допуска...", 'success-msg', () => {
                    currentStep = 'password';
                    DOM.prompt.textContent = 'ENTER CRYPTO-KEY:';
                    DOM.input.type = 'password';
                    DOM.input.disabled = false;
                    DOM.input.focus();
                });
            } else {
                triggerError();
            }
            
        } else if (currentStep === 'password') {
            createLine(`ENTER CRYPTO-KEY: ${'*'.repeat(value.length)}`, 'user-input');
            
            if (value === CONFIG.PASSWORD) {
                DOM.input.disabled = true;
                DOM.input.blur();
                
                typeText("\n[ACCESS GRANTED] Доступ к БД P.M.C \"Atlantis\" разрешен. Извлечение архивов...", 'success-msg', () => {
                    setTimeout(() => {
                        window.location.href = CONFIG.SECRET_URL;
                    }, 1000);
                });
            } else {
                triggerError();
            }
        }
    });

    function triggerError() {
        DOM.input.disabled = true;
        typeText("\n[CRITICAL ERROR] ОТКАЗ В ДОСТУПЕ. Нарушение периметра безопасности. Попытка заблокирована.\n", 'error-msg', () => {
            currentStep = 'login';
            DOM.prompt.textContent = 'ENTER OPERATOR ID:';
            DOM.input.type = 'text';
            DOM.input.disabled = false;
            DOM.input.focus();
        });
    }
</script>
