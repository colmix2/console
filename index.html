<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLANTIS // CORE TERMINAL v1.0</title>
    <style>
        :root {
            --glow: #00ccff;       /* Тактический неоново-голубой цвет Атлантиса */
            --glow-dim: #004466;   
            --bg: #020508;         
            --bg-panel: rgba(5, 10, 15, 0.95); 
            --err: #ff1111;        
            --acc: #00ff66;        
        }
        /* Жёсткая No-Scroll фиксация экрана */
        html, body {
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
        }
        body {
            color: var(--glow);
            font-family: 'Courier New', monospace;
            font-size: 16px;       
            font-weight: 700;      
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        body::before, body::after {
            content: " ";
            display: block;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(0, 204, 255, 0.01) 50%, rgba(0, 0, 0, 0.5) 50%), linear-gradient(90deg, rgba(0, 204, 255, 0.02), rgba(0, 0, 0, 0), rgba(0, 204, 255, 0.02));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        body::after {
            background: linear-gradient(rgba(0, 0, 0, 0) 90%, rgba(0, 204, 255, 0.03) 95%, rgba(0, 0, 0, 0) 100%);
            background-size: 100% 300%;
            animation: scanline 6s linear infinite;
            z-index: 1000;
        }
        @keyframes scanline {
            0% { background-position: 0 -300%; }
            100% { background-position: 0 300%; }
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-4px, 1px); }
            40%, 80% { transform: translate(4px, -1px); }
        }
        .shake { animation: shake 0.2s ease-in-out 2; }
        .terminal-box {
            width: 95%;
            max-width: 850px;
            height: 90vh; 
            background: var(--bg-panel);
            border: 2px solid var(--glow-dim); 
            border-radius: 4px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 204, 255, 0.15), inset 0 0 20px rgba(0, 204, 255, 0.1);
            backdrop-filter: blur(12px);
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            color: var(--glow);
            border-bottom: 2px solid rgba(0, 204, 255, 0.25);
            padding-bottom: 15px;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 204, 255, 0.6); 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex-shrink: 0; 
        }
        .hub-logo {
            display: block;
            width: 150px;           
            height: auto;
            margin: 0 auto 10px auto; 
            opacity: 0.95;
            pointer-events: none;
            filter: drop-shadow(0 0 20px var(--glow)); 
        }
        /* Внутреннее независимое окно вывода логов */
        #out {
            flex-grow: 1; 
            overflow-y: auto; 
            padding-right: 8px;
            margin-bottom: 15px;
        }
        #out::-webkit-scrollbar { width: 4px; }
        #out::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.4); }
        #out::-webkit-scrollbar-thumb { background: var(--glow-dim); border-radius: 2px; }

        .line {
            line-height: 1.6;
            margin-bottom: 10px;
            word-break: break-all;
            white-space: pre-wrap;
            text-shadow: 0 0 4px rgba(0, 204, 255, 0.2); 
        }
        .input-line {
            display: flex;
            align-items: center;
            margin-top: auto; 
            padding-top: 10px;
            border-top: 1px solid rgba(0, 204, 255, 0.1);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        .input-line.active { opacity: 1; visibility: visible; }
        .prompt {
            margin-right: 12px;
            color: var(--glow);
            font-weight: bold;
            flex-shrink: 0;
            letter-spacing: 1px;
            text-shadow: 0 0 6px var(--glow);
        }
        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: text;
            width: 100%;
        }
        .custom-view {
            color: #ffffff;        
            font-family: inherit;
            font-size: inherit;
            font-weight: bold;
            white-space: pre-wrap;
            display: inline-flex;
            align-items: center;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }
        .custom-view::after {
            content: '_';
            margin-left: 4px;
            color: var(--glow);     
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .error { color: var(--err); font-weight: bold; text-shadow: 0 0 10px rgba(255, 17, 17, 0.6); }
        .success { color: var(--acc); font-weight: bold; text-shadow: 0 0 10px rgba(0, 255, 102, 0.6); }
        .gray { color: rgba(0, 204, 255, 0.35); } 
    </style>
</head>
<body>
<div class="terminal-box" id="term">
    <div class="header" id="hd">
        <img src="ART_logo.png" class="hub-logo" alt="ATLANTIS LOGO">
        PMC ATLANTIS // SECURE DATA GATEWAY v1.0
    </div>
    <div id="out"></div>
    <div class="input-line" id="blk">
        <span class="prompt" id="pr">ENTER SECURITY ACCESS KEY:</span>
        <div class="input-wrapper">
            <input type="text" id="inp" autocomplete="off" disabled>
            <div class="custom-view" id="view"></div>
        </div>
    </div>
</div>
<script>
const CFG = { REAL_TOKEN: "324", SPD: 15 };
const DOM = { 
    term: document.getElementById('term'), inp: document.getElementById('inp'), 
    view: document.getElementById('view'), out: document.getElementById('out'), 
    pr: document.getElementById('pr'), blk: document.getElementById('blk') 
};
let step = 'login', dialogueStage = 0, wordTimer = null, targetWord = "";
const delay = ms => new Promise(r => setTimeout(r, ms));
let audioCtx = null;

function playBeep(f, t, d) {
    try {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        osc.type = t; osc.frequency.value = f;
        g.gain.setValueAtTime(0.01, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function addLine(txt, cls = "") {
    const d = document.createElement('div'); d.className = `line ${cls}`; d.textContent = txt;
    DOM.out.appendChild(d); DOM.out.scrollTop = DOM.out.scrollHeight; return d;
}
async function type(txt, cls = "") {
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        d.textContent += txt.charAt(i); playBeep(800, 'sine', 0.015); await delay(CFG.SPD);
    }
}
async function runBootLogs() {
    DOM.out.innerHTML = "";
    const p = [
        "SYNCHRONIZING RECON SAT-LINKS... DONE", 
        "DECRYPTING DEPARTMENT LOGS... LOADED", 
        "ISOLATING ROUTER GATEWAYS... ACTIVE", 
        "ESTABLISHING TAC-COM CONNECTION... SUCCESS"
    ];
    for (let i = 0; i < p.length; i++) {
        await delay(70 + Math.random() * 70); addLine("[ATLANTIS-NET] | " + p[i], 'gray');
    }
    await delay(300);
    await type("SYS: WELCOME BACK, AGENT ANDREY.", "gray");
    ask('ENTER SECURITY ACCESS KEY:', 'login', false);
}
function ask(p, s, m) { 
    step = s; DOM.pr.textContent = p; DOM.inp.value = DOM.view.textContent = ""; 
    DOM.inp.disabled = false; DOM.blk.classList.add('active'); DOM.inp.focus(); 
}
function err(m) { 
    DOM.term.classList.add('shake'); playBeep(130, 'sawtooth', 0.4); 
    setTimeout(() => DOM.term.classList.remove('shake'), 400); addLine(m, "error"); 
}
async function terminalScramblerDie(m) {
    clearTimeout(wordTimer); DOM.blk.classList.remove('active'); DOM.inp.disabled = true; err(m); await delay(1000);
    await type("[SYS]: КРИТИЧЕСКАЯ УГРОЗА ВЗЛОМА. СКРАМБЛЕР ВЫЖЕГ ПОРТЫ ПАМЯТИ.", "error"); await delay(1500);
    DOM.out.innerHTML = ""; playBeep(50, 'sawtooth', 2.0); DOM.term.classList.add('shake');
    const errBox = addLine("\n\n\n\n      ███████  ██████  ██████   ██████  ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      █████    ██████  ██████  ██    ██ ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      ███████  ██   ██ ██   ██  ██████  ██   ██ \n\n", "error");
    errBox.style.fontSize = "22px"; errBox.style.textAlign = "center"; await delay(2000); location.reload();
}
async function bar() {
    const d = addLine("", 'success');
    for (let p = 0; p <= 100; p += 5) { 
        d.textContent = `DECRYPTING FILES: [${"█".repeat(p/5)}${".".repeat(20-(p/5))}] ${p}%`; 
        playBeep(400 + p * 2, 'sine', 0.02); await delay(40); 
    }
}
async function openMainMenu() {
    DOM.out.innerHTML = ""; step = 'main_menu';
    await type("========================================", "gray");
    await type("ACCESS GRANTED // AGENT ANDREY CORE ENVIRONMENT", "success");
    await type("1. ДЕПАРТАМЕНТЫ КОНТРАКТНИКОВ", "success");
    await type("2. СЕТЕВЫЕ ПРОТОКОЛЫ ОПЕРАТОРОВ (ТОС)", "success");
    await type("3. ТЕРМИНАЛЬНЫЙ ВЫХОД", "success");
    await type("========================================", "gray");
    ask('ENTER COMMAND (1-3):', 'main_menu', false);
}

// ИСПРАВЛЕНО: Добавлен официальный Департамент Re-Union в список контрактников!
async function showContractorsMenu() {
    DOM.out.innerHTML = ""; step = 'contractors_menu';
    await type("=== ДЕПАРТАМЕНТЫ КОНТРАКТНИКОВ PMC ATLANTIS ===", "success");
    addLine("1. Служба Безопасности L.a.S Network", "gray");
    addLine("2. Спецотряд SHF (Secret Highly Fighters)", "gray");
    addLine("3. Департамент Re-Union (НИИ Японии)", "success"); // Новая лорная интеграция!
    addLine("4. Назад в Главное Меню", "gray");
    ask('ВЫБЕРИТЕ ВЕДОМСТВО (1-4):', 'contractors_menu', false);
}

async function showOperatorsMenu() {
    DOM.out.innerHTML = ""; step = 'operators_menu';
    await type("=== СЕТЕВЫЕ ПРОТОКОЛЫ ОПЕРАТОРОВ (ТОС) ===", "success");
    addLine("1. Лог оператора: BILL [АКТИВЕН]", "success");
    addLine("2. Лог оператора: SIN [НЕДОСТУПНО]", "gray");
    addLine("3. Назад в Главное Меню", "gray");
    ask('ВЫБЕРИТЕ ОПЕРАТОРА (1-3):', 'operators_menu', false);
}
// ИСПРАВЛЕНО: Полностью изменён логин Билла — оставлен строго один раздел Пароли!
async function showBillMenu() {
    DOM.out.innerHTML = ""; step = 'bill_menu';
    await type("=== ТАКТИЧЕСКИЙ ПРОТОКОЛ ОПЕРАТОРА: BILL ===", "success");
    addLine("1. ПАРОЛИ К КОРНЕВЫМ СЕРВЕРАМ MGF", "success"); // Единственный рабочий раздел
    addLine("2. Назад к списку операторов", "gray");
    ask('ВЫБЕРИТЕ РАЗДЕЛ (1-2):', 'bill_menu', false);
}

// Запуск Фазы 1 взлома Паролей Билла
function startBillPasswordHacking1() {
    step = 'bill_h_1'; DOM.out.innerHTML = "";
    err("⚠️ ВЗЛОМ КРИПТОКЛЮЧЕЙ BILL: ФАЗА 1/3 (СДВИГ ЧАСТОТЫ РАДАРА)");
    let n1 = Math.floor(Math.random() * 5) + 3; let n2 = Math.floor(Math.random() * 4) + 2;
    targetWord = (n1 * n2).toString();
    addLine(`>>> КВАНТОВЫЙ ШИФР: [ ПОТОК ${n1} ГГц ]`, "error");
    addLine(`>>> КОЭФФИЦИЕНТ:   [ МАТРИЦА x${n2} ]`, "gray");
    ask('ВВЕДИТЕ ДЕКОД-МАРКЕР (УМНОЖЕНИЕ):', 'bill_h_1', false);
    clearTimeout(wordTimer);
    wordTimer = setTimeout(() => terminalScramblerDie("🚨 ТАЙМАУТ ВЗЛОМА. ЗАЩИТА BILL БЛОКИРОВАЛА ЧАСТОТУ."), 35000);
}

function startBillPasswordHacking2() {
    step = 'bill_h_2'; err("⚠️ ВЗЛОМ КРИПТОКЛЮЧЕЙ BILL: ФАЗА 2/3 (ВИЗУАЛЬНЫЙ ЗАХВАТ ПНВ)");
    let chars = "ATLANTIS77";
    let code = Array.from({length: 4}, () => chars[Math.floor(Math.random() * chars.length)]).join("");
    targetWord = code;
    const d = addLine(`>>> МГНОВЕННЫЙ КЛЮЧ ЯДРА: [ ${code} ]`, "error");
    setTimeout(() => {
        d.textContent = `>>> МГНОВЕННЫЙ КЛЮЧ ЯДРА: [ СКРЫТО ИМПУЛЬСОМ ]`;
        ask('ВВЕДИТЕ КЛЮЧ ПО ПАМЯТИ:', 'bill_h_2', false);
    }, 1500);
    clearTimeout(wordTimer);
    wordTimer = setTimeout(() => terminalScramblerDie("🚨 ТАЙМАУТ ВЗЛОМА. МАТРИЦА СБРОШЕНА."), 35000);
}
function startBillPasswordHacking3() {
    step = 'bill_h_3'; err("⚠️ ВЗЛОМ КРИПТОКЛЮЧЕЙ BILL: ФАЗА 3/3 (СПЕКТРАЛЬНЫЙ АНАЛИЗАТОР)");
    let pulses = Math.floor(Math.random() * 5) + 4; targetWord = pulses.toString();
    let wave = "▲ ".repeat(pulses);
    addLine(`>>> СИГНАЛ ДЕШИФРАТОРА: [ ${wave}]`, "error");
    addLine(`>>> СКОЛЬКО ИМПУЛЬСОВ \"▲\" СИНХРОНИЗИРОВАНО В ЦЕПИ?`, "gray");
    ask('ВВЕДИТЕ ЧИСЛО ИМПУЛЬСОВ:', 'bill_h_3', false);
    clearTimeout(wordTimer);
    wordTimer = setTimeout(() => terminalScramblerDie("🚨 ТАЙМАУТ СИНХРОНИЗАЦИИ. БЛОКИРОВКА."), 35000);
}

// ИСПРАВЛЕНО: Финальная награда выдает рутовый Логин: Base и Пароль: ATLANTIS111
async function successBillPasswordHacking() {
    clearTimeout(wordTimer); DOM.out.innerHTML = ""; await bar();
    await type("===================================================", "success");
    await type(">>> ДЕШИФРАЦИЯ КОРНЕВЫХ СЕРВЕРОВ MGF ЗАВЕРШЕНА УСПЕШНО!", "success");
    await type(">>> СИСТЕМА ИЗВЛЕКЛА ГЛАВНЫЕ АДМИНИСТРАТИВНЫЕ ДАННЫЕ:", "success");
    await type("---------------------------------------------------", "gray");
    await type("🔓 Логин:  Base", "success");
    await type("🔓 Пароль: ATLANTIS111", "success");
    await type("---------------------------------------------------", "gray");
    await type(">>> ПРИМЕЧАНИЕ: Используйте эти данные для рутового прохода.", "gray");
    await type("===================================================", "success");
    await delay(7000);
    showBillMenu();
}
DOM.inp.oninput = () => { DOM.view.textContent = DOM.inp.value; };
DOM.inp.onkeydown = async (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault(); initAudio(); 

    const v = DOM.inp.value, cv = v.trim(); if (!v) return;
    DOM.blk.classList.remove('active'); DOM.inp.disabled = true; 
    addLine(DOM.pr.textContent + " " + cv, 'success'); await delay(300);
    
    if (step === 'login') {
        if (cv === CFG.REAL_TOKEN) { await bar(); await openMainMenu(); } 
        else { err("ACCESS DENIED. INVALID ACCESS KEY."); await delay(1500); ask('ENTER SECURITY ACCESS KEY:', 'login', false); }
    } 
    else if (step === 'main_menu') {
        if (cv === '1') showContractorsMenu();
        else if (cv === '2') showOperatorsMenu();
        else if (cv === '3') { DOM.out.innerHTML = ""; step = 'login'; ask('ENTER SECURITY ACCESS KEY:', 'login', false); }
        else { err("НЕВЕРНАЯ КОМАНДА."); await delay(1000); openMainMenu(); }
    }
    else if (step === 'contractors_menu') {
        if (cv === '4') openMainMenu();
        else if (cv === '1' || cv === '2' || cv === '3') { 
            err("🚨 ОШИБКА: ДОСТУП ОГРАНИЧЕН КОНТРАКТОМ. ОЖИДАНИЕ ТАКТИЧЕСКИХ ФАЗ СЕРВЕРА..."); 
            await delay(1500); showContractorsMenu(); 
        } else { err("НЕВЕРНЫЙ ВЫБОР."); await delay(1000); showContractorsMenu(); }
    }
    else if (step === 'operators_menu') {
        if (cv === '1') showBillMenu();
        else if (cv === '3') openMainMenu();
        else { err("РАЗДЕЛ ЗАБЛОКИРОВАН."); await delay(1000); showOperatorsMenu(); }
    }
    else if (step === 'bill_menu') {
        if (cv === '1') startBillPasswordHacking1();
        else if (cv === '2') showOperatorsMenu();
        else { err("НЕВЕРНЫЙ ВЫБОР."); await delay(1000); showBillMenu(); }
    }
    else if (step === 'bill_h_1') {
        if (cv === targetWord) startBillPasswordHacking2(); else await terminalScramblerDie("🚨 ОШИБКА ЧАСТОТЫ.");
    }
    else if (step === 'bill_h_2') {
        if (cv.toUpperCase() === targetWord) startBillPasswordHacking3(); else await terminalScramblerDie("🚨 ОШИБКА МАТРИЦЫ.");
    }
    else if (step === 'bill_h_3') {
        if (cv === targetWord) await successBillPasswordHacking(); else await terminalScramblerDie("🚨 ОШИБКА СИНХРОНИЗАЦИИ.");
    }
};

document.onclick = () => { initAudio(); if (DOM.inp.disabled === false) DOM.inp.focus(); };
window.onload = () => { runBootLogs(); };
</script>
</body>
</html>
