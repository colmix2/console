<script>
const CFG = { LOGIN: "bill", PASS: "124", URL: "https://google.com", SPD: 15 };
const DOM = { term: document.getElementById('term'), inp: document.getElementById('inp'), view: document.getElementById('view'), out: document.getElementById('out'), pr: document.getElementById('pr'), blk: document.getElementById('blk') };
let step = 'login', isMask = false;
const delay = ms => new Promise(r => setTimeout(r, ms));

function playBeep(f, t, d) {
    try {
        const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
        o.type = t; o.frequency.value = f; g.gain.setValueAtTime(0.03, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, c.currentTime + d);
        o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + d);
    } catch(e) {}
}

function addLine(txt, cls = "") {
    const d = document.createElement('div'); d.className = `line ${cls}`; d.textContent = txt; DOM.out.appendChild(d);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); return d;
}

async function type(txt, cls = "") {
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        d.textContent += txt.charAt(i); if (Math.random() > 0.3) playBeep(800, 'square', 0.02); await delay(CFG.SPD);
    }
}

async function runBootLogs() {
    const p = ["BYPASSING FIREWALL... SUCCESS", "STEALTH MODE: CCJV OVERRIDE... [DONE]", "SPOOFING IP... INT-INTERNAL", "CLEANING LOGS... ERASED", "ANTI-CYBER ATTACK PROTOCOL ACTIVE."];
    for (let i = 0; i < p.length; i++) {
        await delay(150 + (performance.now() / 1000).toFixed(3) * 2); addLine(`[DEBUG] ${Math.floor(Math.random() * p.length)}| ` + p[i], 'gray'); playBeep(120, 'sawtooth', 0.01);
    }
    await delay(300); await type("SYS: ESTABLISHING PROXY TUNNEL... STANDING BY FOR AGENT.", "success"); ask('ENTER AGENT ID:', 'login', false);
}

function ask(p, s, m) { step = s; isMask = m; DOM.pr.textContent = p; DOM.inp.value = DOM.view.textContent = ""; DOM.inp.disabled = false; DOM.blk.classList.add('active'); DOM.inp.focus(); }
function err(m) { DOM.term.classList.add('shake'); playBeep(140, 'triangle', 0.35); setTimeout(() => DOM.term.classList.remove('shake'), 400); addLine(m, "error"); }

async function bar() {
    const d = addLine("", 'success');
    for (let p = 0; p <= 100; p += 5) { d.textContent = `DECRYPTING: [${"#".repeat(p/5)}${".".repeat(20-(p/5))}] ${p}%`; playBeep(600 + p * 2, 'sine', 0.02); await delay(40); }
}

DOM.inp.oninput = () => DOM.view.textContent = isMask ? "*".repeat(DOM.inp.value.length) : DOM.inp.value;
DOM.inp.onkeydown = async (e) => {
    if (e.key !== 'Enter') return;
    const v = DOM.inp.value, cv = v.trim(); if (!v) return;
    DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
    addLine(`${DOM.pr.textContent} ${isMask ? "*".repeat(v.length) : cv}`, 'success'); await delay(300);
    
    if (step === 'login') {
        if (cv.toLowerCase() === CFG.LOGIN) {
            ask('ENTER PASSKEY:', 'pass', true); // Здесь всё работает
        } else { 
            err("DENIED: UNKNOWN AGENT."); await delay(1000); ask('ENTER AGENT ID:', 'login', false); 
        }
    } else if (step === 'pass') {
        if (cv === CFG.PASS) { 
            await bar(); await type("ACCESS GRANTED. REDIRECTING TO SECURE CORE...", "success"); await delay(1200); window.location.href = CFG.URL; 
        } else { 
            err("SECURITY VIOLATION. LOCKDOWN ENFORCED."); await delay(1500); ask('ENTER AGENT ID:', 'login', false); 
        }
    }
};
document.onclick = () => DOM.inp.disabled || DOM.inp.focus(); window.onload = runBootLogs;
</script>
