<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLANTIS // SECURE TERMINAL v4.0</title>
    <style>
        :root {
            --glow: #00ff41;
            --bg: #020504;
            --bg-panel: rgba(2, 15, 5, 0.7);
            --err: #ff1111;
            --acc: #00ffff;
        }
        body.alarm {
            --glow: #ff1111;
            --bg-panel: rgba(20, 2, 2, 0.7);
        }
        body {
            background-image: url('https://githubusercontent.com');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: var(--bg);
            color: var(--glow);
            font-family: 'Courier New', monospace;
            font-size: 15px;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }
        body::before, body::after {
            content: " ";
            display: block;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        body::after {
            background: linear-gradient(rgba(0, 0, 0, 0) 90%, rgba(0, 255, 65, 0.05) 95%, rgba(0, 0, 0, 0) 100%);
            background-size: 100% 300%;
            animation: scanline 6s linear infinite;
            z-index: 1000;
        }
        body.alarm::after {
            background: linear-gradient(rgba(0, 0, 0, 0) 90%, rgba(255, 17, 17, 0.1) 95%, rgba(0, 0, 0, 0) 100%);
            background-size: 100% 300%;
        }
        @keyframes scanline {
            0% { background-position: 0 -300%; }
            100% { background-position: 0 300%; }
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-4px, 2px); }
            40%, 80% { transform: translate(4px, -2px); }
        }
        .shake {
            animation: shake 0.2s ease-in-out 2;
        }
        .terminal-box {
            width: 100%;
            max-width: 850px;
            background: var(--bg-panel);
            border: 1px solid var(--glow);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1), inset 0 0 20px rgba(0, 255, 65, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            transition: border 0.3s;
        }
        .header {
            color: var(--glow);
            border-bottom: 1px solid rgba(0, 255, 65, 0.3);
            padding-bottom: 15px;
            margin-bottom: 20px;
            font-weight: bold;
            line-height: 1.4;
            text-shadow: 0 0 8px var(--glow);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .hub-logo {
            display: block;
            max-width: 150px;
            height: auto;
            margin: 0 auto 15px auto;
            opacity: 0.9;
            pointer-events: none;
            filter: drop-shadow(0 0 8px var(--glow));
        }
        .line {
            line-height: 1.6;
            margin-bottom: 8px;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .input-line {
            display: flex;
            align-items: center;
            margin-top: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
        }
        .input-line.active {
            opacity: 1;
            visibility: visible;
        }
        .prompt {
            margin-right: 12px;
            color: var(--glow);
            font-weight: bold;
            flex-shrink: 0;
            letter-spacing: 1px;
        }
        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: default;
        }
        .custom-view {
            color: #fff;
            font-family: inherit;
            font-size: inherit;
            white-space: pre-wrap;
            display: inline-flex;
            align-items: center;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        .custom-view::after {
            content: '_';
            margin-left: 3px;
            color: var(--glow);
            animation: blink 0.8s infinite;
            text-shadow: 0 0 8px var(--glow);
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .error {
            color: var(--err);
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 17, 17, 0.6);
        }
        .success {
            color: var(--acc);
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
        }
        .gray {
            color: rgba(0, 255, 65, 0.4);
        }
    </style>
</head>
<body>
<div class="terminal-box" id="term">
    <div class="header" id="hd">
        <img src="atlantis.png" class="hub-logo" alt="ATLANTIS LOGO">
        P.M.C. "ATLANTIS" // INFILTRATION & STEALTH OPERATIONS NETWORK
    </div>
    <div id="out"></div>
    <div class="input-line" id="blk">
        <span class="prompt" id="pr">AGENT ID / EMPLOYEE:</span>
        <div class="input-wrapper">
            <input type="text" id="inp" autocomplete="off" disabled>
            <div class="custom-view" id="view"></div>
        </div>
    </div>
</div>
<script>
const CFG = { LOGIN: "bill", PASS: "324", SPD: 15 };
const DOM = { 
    term: document.getElementById('term'), 
    inp: document.getElementById('inp'), 
    view: document.getElementById('view'), 
    out: document.getElementById('out'), 
    pr: document.getElementById('pr'), 
    blk: document.getElementById('blk') 
};
let step = 'login', isMask = false, gameInterval = null, stage = 0, targetWord = "", wordTimer = null, isKeyGame = false;
const delay = ms => new Promise(r => setTimeout(r, ms));

let audioCtx = null;

function playBeep(f, t, d) {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        
        osc.type = t; 
        osc.frequency.value = f; 
        
        g.gain.setValueAtTime(0.03, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
        
        osc.connect(g); 
        g.connect(audioCtx.destination); 
        
        osc.start(); 
        osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}

function addLine(txt, cls = "") {
    const d = document.createElement('div'); 
    d.className = `line ${cls}`; 
    d.textContent = txt; 
    DOM.out.appendChild(d);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); 
    return d;
}

async function type(txt, cls = "") {
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        d.textContent += txt.charAt(i); 
        if (Math.random() > 0.3) playBeep(800, 'square', 0.02); 
        await delay(CFG.SPD);
    }
}

async function runBootLogs() {
    const p = ["BYPASSING FIREWALL... SUCCESS", "STEALTH MODE: CCJV OVERRIDE... [DONE]", "SPOOFING IP... INT-INTERNAL", "CLEANING LOGS... ERASED", "ANTI-CYBER ATTACK PROTOCOL ACTIVE."];
    for (let i = 0; i < p.length; i++) {
        await delay(150 + (performance.now() / 1000).toFixed(3) * 2); 
        addLine("[DEBUG] " + Math.floor(Math.random() * p.length) + "| " + p[i], 'gray'); 
        playBeep(120, 'sawtooth', 0.01);
    }
    await delay(300); 
    await type("SYS: FOR ACCESS ENTRY - SUBMIT AUTH KEY OR EMPLOYEE ID.", "gray");
    await type("SYS: STANDING BY...", "success"); 
    ask('AGENT ID / EMPLOYEE:', 'login', false);
}

function ask(p, s, m) { 
    step = s; 
    isMask = m; 
    DOM.pr.textContent = p; 
    DOM.inp.value = DOM.view.textContent = ""; 
    DOM.inp.disabled = false; 
    DOM.blk.classList.add('active'); 
    DOM.inp.focus(); 
}

function err(m) { 
    DOM.term.classList.add('shake'); 
    playBeep(140, 'triangle', 0.35); 
    setTimeout(() => DOM.term.classList.remove('shake'), 400); 
    addLine(m, "error"); 
}

function die(m) { 
    clearTimeout(wordTimer); 
    clearInterval(gameInterval); 
    err(m); 
    setTimeout(() => location.reload(), 2500); 
}

async function scramblerDie() {
    clearTimeout(wordTimer);
    clearInterval(gameInterval);
    DOM.blk.classList.remove('active');
    DOM.inp.disabled = true;
    
    await delay(500);
    await type("Scrambler: Наконец-то. Скрамблер заработал.. Не долго ты продержался.", "error");
    await delay(2000);
    
    DOM.out.innerHTML = "";
    document.getElementById('hd').style.display = 'none';
    
    playBeep(80, 'sawtooth', 1.5);
    playBeep(60, 'sawtooth', 1.5);
    DOM.term.classList.add('shake');
    
    const errBox = addLine("\n\n\n\n      ███████  ██████  ██████   ██████  ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      █████    ██████  ██████  ██    ██ ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      ███████  ██   ██ ██   ██  ██████  ██   ██ \n\n", "error");
    errBox.style.fontSize = "22px";
    errBox.style.textAlign = "center";
    errBox.style.textShadow = "0 0 15px #ff1111";
    
    await delay(1000);
    addLine(">>> КРИТИЧЕСКИЙ СБОЙ ПАМЯТИ: СНОС СИСТЕМЫ...", "error");
    await delay(1500);
    
    location.reload();
}

async function bar() {
    const d = addLine("", 'success');
    for (let p = 0; p <= 100; p += 5) { 
        d.textContent = `DECRYPTING: [${"#".repeat(p/5)}${".".repeat(20-(p/5))}] ${p}%`; 
        playBeep(600 + p * 2, 'sine', 0.02); 
        await delay(40); 
    }
}

async function startSpeedGame() {
    step = 'speed_game';
    stage = 0;
    document.body.classList.add('alarm');
    playBeep(220, 'sawtooth', 0.5);
    playBeep(180, 'sawtooth', 0.5);
    err("⚠️ CRITICAL SECURITY ALERT: FOREIGN IP DETECTED!");
    await delay(600);
    await type(">>> АКТИВИРОВАНА СИСТЕМА ЭКСТРЕННОЙ БЛОКИРОВКИ БАЗЫ ДАННЫХ!", "error");
    await type(">>> ИСКАЖЕНИЕ ТРАФИКА! ВВОДИТЕ СЛОВА СТРОГО ЗАДОМ НАПЕРЕД!", "error");
    await delay(300);
    nextSpeedWord();
}

function nextSpeedWord() {
    if (stage >= 3) {
        successSpeedGame();
        return;
    }
    const words = ["OVERRIDE", "DECRYPT", "BYPASS", "INTRUDER", "EXPLOIT"];
    const rawWord = words[Math.floor(Math.random() * words.length)];
    targetWord = rawWord.split("").reverse().join("");
    addLine(`[ФАЗА 1 - ЭТАП ${stage + 1}/3] ИСХОДНЫЙ КОД: ${rawWord}`, "error");
    ask('ВВЕДИТЕ РЕВЕРС-КОД:', 'speed_game', false);
    clearTimeout(wordTimer);
    wordTimer = setTimeout(() => die("🚨 ПРЕВЫШЕНО ВРЕМЯ ОЖИДАНИЯ ФАЗЫ 1. ЛОКДАУН."), 6000);
}

async function successSpeedGame() {
    clearTimeout(wordTimer);
    document.body.classList.remove('alarm');
    await type(">>> КОНТРАТАКА ОТРАЖЕНА! ЗАЩИТА БАЗЫ ДАННЫХ СЛОМАНА.", "success");
    await delay(600);
    await type("[ШТАБ]: Узел связи перехвачен. Инициализация аудио-протокола...", "success");
    await delay(1500);
    await type("[ШТАБ]: Ахх... ну да. Молодец, гуд... гуд...", "success");
    await delay(1000);
    await type("[ШТАБ]: Признаться, я до последнего думал, что наши безопасники тебя отрубят. Но ты упрямый.", "success");
    await delay(1200);
    await type("[ШТАБ]: Давай начистоту. Что конкретно ты хочешь здесь найти?", "success");
    await delay(800);
    
    DOM.term.classList.add('shake');
    playBeep(90, 'sawtooth', 0.6);
    playBeep(70, 'triangle', 0.6);
    setTimeout(() => DOM.term.classList.remove('shake'), 600);
    
    await type("[ШТАБ]: Ты сейчас ковыряешься в закрытом секторе и ОЧЕНЬ СИЛЬНО нам мешаешь! Для чего всё это?", "error");
    await delay(2000);
    await type("[ШТАБ]: Впрочем, мне плевать на твои мотивы. Мы тебя запеленговали.", "success");
    await delay(800);
    await type("[ШТАБ]: Перехожу на ручной протокол изоляции. Прощай, Агент.", "error");
    await delay(1200);
    startPhaseTwo();
}

async function startPhaseTwo() {
    step = 'phase2';
    stage = 0;
    document.body.classList.add('alarm');
    err("🚨 АВАРИЙНАЯ БЛОКИРОВКА СЕТЕВОГО ОКРУЖЕНИЯ! ФАЗА 2");
    await delay(600);
    await type(">>> ШТАБ ИЗОЛИРУЕТ НАШ IP! ПЕРЕХВАТЫВАЙТЕ КООРДИНАТЫ УЗЛОВ!", "error");
    nextPhaseTwoNode();
}

function nextPhaseTwoNode() {
    if (stage >= 4) {
        startPhaseThree();
        return;
    }
    const letters = ["A", "B", "C", "D", "X", "Y"];
    const numbers = ["1", "2", "3", "4", "5"];
    targetWord = letters[Math.floor(Math.random() * letters.length)] + numbers[Math.floor(Math.random() * numbers.length)];
    addLine(`[ФАЗА 2 - УЗЕЛ ${stage + 1}/4] КАНАЛ СВЯЗИ: МАТРИЦА ${targetWord}`, "error");
    const timeLimit = 5000 - (stage * 1000);
    ask('ВВЕДИТЕ КООРДИНАТУ:', 'phase2', false);
    clearTimeout(wordTimer);
    wordTimer = setTimeout(() => die("🚨 МАТРИЧНАЯ БЛОКИРОВКА ЗАВЕРШЕНА. ВЫ ОТКЛЮЧЕНЫ."), timeLimit);
}
async function startPhaseThree() {
    step = 'phase3'; 
    stage = 0;
    addLine(">>> СЕТЕВОЙ КОНТУР ФАЗЫ 2 СТАБИЛИЗИРОВАН.", "success"); 
    await delay(500);
    await type("[ШТАБ]: С-Система... потеряна... Запуск протокола ВЫЖИГАНИЯ ЯДРА...", "error");
    await type("[ШТАБ]: Гори в аду, Агент.", "error"); 
    await delay(800);
    err("🚨 ВНИМАНИЕ: ЗАПУЩЕН ПРОТОКОЛ ПОЛНОГО СТИРАНИЯ ЯДРА СЕРВЕРА! ФАЗА 3"); 
    await delay(600);
    nextPhaseThreeNode();
}

function nextPhaseThreeNode() {
    if (stage >= 3) { 
        startPhaseFour(); 
        return; 
    }
    DOM.blk.classList.remove('active'); 
    DOM.inp.disabled = true;
    let rd = Array.from({length: 3}, () => Math.floor(Math.random() * 10));
    targetWord = rd.join(""); 
    const d = addLine(`[ФАЗА 3 - КЛЮЧ ЯДРА ${stage + 1}/3] ЧАСТОТА: ` + targetWord, "success"); 
    playBeep(900, 'sine', 0.1);
    setTimeout(() => { 
        d.textContent = `[ФАЗА 3 - КЛЮЧ ЯДРА ${stage + 1}/3] ЧАСТОТА: [СКРЫТО]`; 
        ask('ВВЕДИТЕ СИНХРО-ЧАСТОТУ:', 'phase3', false); 
    }, 2500);
    clearTimeout(wordTimer); 
    wordTimer = setTimeout(() => die("🚨 ЯДРО ВЫЖЖЕНО. ОПЕРАЦИЯ ПРОВАЛЕНА."), 6000);
}

async function startPhaseFour() {
    step = 'phase4'; 
    stage = 0;
    addLine(">>> ЧАСТОТЫ ЯДРА ФАЗЫ 3 СИНХРОНИЗИРОВАНЫ.", "success"); 
    await delay(600);
    err("🚨 АЛАРМ: ШТАБ ВКЛЮЧИЛ АУДИО-ГЛУШИЛКУ! ФАЗА 4");
    await type(">>> ПОВТОРЯЙТЕ СЕРИИ СИГНАЛОВ КЛАВИШАМИ H (ВЫСОКИЙ) И L (НИЗКИЙ)!", "error"); 
    nextPhaseFourAudio();
}

function nextPhaseFourAudio() {
    if (stage >= 3) { 
        startPhaseFive(); 
        return; 
    }
    DOM.blk.classList.remove('active'); 
    DOM.inp.disabled = true;
    let seq = []; 
    for(let i=0; i<3+stage; i++) {
        seq.push(Math.random() > 0.5 ? "H" : "L");
    }
    targetWord = seq.join(""); 
    addLine(`[ФАЗА 4 - СИГНАЛ ${stage + 1}/3] ВОСПРОИЗВЕДЕНИЕ...`, "error");
    triggerAudioChain(targetWord, 0);
}

function triggerAudioChain(w, i) {
    if(i >= w.length) { 
        addLine(">>> ПОВТОРИТЕ ПОСЛЕДОВАТЕЛЬНОСТЬ (ПРИМЕР: HLHH):", "gray"); 
        ask('ВВОД СИГНАЛА:', 'phase4', false); 
        clearTimeout(wordTimer); 
        // При проигрыше по таймеру — вызываем Скрамблера
        wordTimer = setTimeout(() => scramblerDie(), 5000); 
        return; 
    }
    const currentLetter = w[i].toUpperCase();
    const frequency = currentLetter === "H" ? 1500 : 300;
    playBeep(frequency, 'sine', 0.2); 
    setTimeout(() => triggerAudioChain(w, i+1), 650);
}
async function startPhaseFive() {
    step = 'phase5'; stage = 0;
    addLine(">>> ЗВУКОВОЙ КАНАЛ СИНХРОНИЗИРОВАН.", "success"); await delay(600);
    err("🚨 КРИТИЧЕСКИЙ DDOS-ШТОРМ! СЕРВЕР ПЕРЕГРУЖЕН! ФАЗА 5");
    await type(">>> СКАНИРУЙТЕ БИНАРНЫЕ СТРОКИ И НАХОДИТЕ АНОМАЛИЮ!", "error"); nextPhaseFiveVirus();
}
function nextPhaseFiveVirus() {
    if (stage >= 3) { startPhaseSix(); return; }
    DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
    let len = 8 + stage * 2;
    let baseArr = Array.from({length: len}, () => Math.random() > 0.5 ? "1" : "0");
    let normal = baseArr.join("");
    let anomalyArr = [...baseArr];
    for(let i = 0; i < 3; i++) { anomalyArr[i] = anomalyArr[i] === "1" ? "0" : "1"; }
    let anomaly = anomalyArr.join("");
    let anomalyIdx = Math.floor(Math.random() * 4); let lines = [];
    for(let i=0; i<4; i++) {
        if(i === anomalyIdx) lines.push(anomaly);
        else lines.push(normal);
    }
    targetWord = (anomalyIdx + 1).toString(); addLine(`[ФАЗА 5 - ПОТОК ${stage + 1}/3] СКАНИРОВАНИЕ ПАКЕТОВ:`, "error");
    for(let i=0; i<4; i++) addLine(`${i+1}: ${lines[i]}`, "gray");
    ask('ВВЕДИТЕ НОМЕР АНОМАЛЬНОЙ СТРОКИ:', 'phase5', false);
    clearTimeout(wordTimer); wordTimer = setTimeout(() => die("🚨 ТЕРМИНАЛ КРАШНУЛСЯ ПОД DDOS-УДАРОМ."), 5000);
}
async function startPhaseSix() {
    step = 'phase6'; stage = 0;
    addLine(">>> ПОТОКИ ДАННЫХ ОЧИЩЕНЫ ОТ ВИРУСОВ.", "success"); await delay(600);
    err("🚨 СЕТЬ РАЗВАЛИВАЕТСЯ НА ЧАСТИ! ФИНАЛЬНАЯ МАРШРУТИЗАЦИЯ! ФАЗА 6");
    await type(">>> ПРОВОДИТЕ ПАКЕТ СТРОГО ЧЕРЕЗ ОТКРЫТЫЕ УЗЛЫ СВЯЗИ!", "error"); nextPhaseSixRoute();
}
function nextPhaseSixRoute() {
    if (stage >= 3) { endAllGamesSuccess(); return; }
    let ok = Math.random() > 0.5 ? "A" : "B"; targetWord = ok;
    addLine(`[ФАЗА 6 - ШЛЮЗ ${stage + 1}/3] АНАЛИЗ МАРШРУТОВ:`, "error");
    addLine(`[МАРШРУТ А]: ` + (ok === "A" ? "ОТКРЫТ [READY]" : "ЗАБЛОКИРОВАН [BLOCKED]"), ok === "A" ? "success" : "error");
    addLine(`[МАРШРУТ Б]: ` + (ok === "B" ? "ОТКРЫТ [READY]" : "ЗАБЛОКИРОВАН [BLOCKED]"), ok === "B" ? "success" : "error");
    ask('ВЫБЕРИТЕ ОТКРЫТЫЙ МАРШРУТ (А / Б):', 'phase6', false);
    clearTimeout(wordTimer); wordTimer = setTimeout(() => die("🚨 ПАКЕТ СГОРЕЛ В РАЗОРВАННОЙ СЕТИ."), 3500);
}

// ОБНОВЛЕННЫЙ ФИНАЛ: ВЫДАЕТ ДАННЫЕ И РЕДИРЕКТИТ ПО ССЫЛКЕ
async function endAllGamesSuccess() {
    clearTimeout(wordTimer); document.body.classList.remove('alarm'); await bar();
    await type(">>> ВСЕ 6 ФАЗ ОБХОДА ЗАВЕРШЕНЫ С ПОЛНЫМ ТРИУМФОМ!", "success");
    await type(">>> КОРНЕВОЙ ДОСТУП ВЫРВАН. СЕТЬ ШТАБА АТЛАНТИСА ПОДАВЛЕНА.", "success");
    await type(">>> НАЙДЕНЫ ГЛУБОКИЕ ЛОГИ BILL. ПАРОЛЬ ОТ АККАУНТА: " + CFG.PASS, "success");
    await delay(1500);
    await type(">>> ИНИЦИАЛИЗАЦИЯ ЗАЩИЩЕННОГО ПЕРЕНАПРАВЛЕНИЯ К СЕРВЕРУ...", "gray");
    // Выдерживаем паузу в 3 секунды для атмосферы и редиректим на твою ссылку из конфига
    await delay(3000); 
    window.location.href = "https://docs.google.com/document/d/1m7fFUMd31Jf5VVfPutMKAH2W03n19hspUK0ad03lGb4/edit?usp=sharing"; // Твоя секретная ссылка (замени на любую свою внутри кавычек)
}

async function startKeyGame() {
    step = 'game'; stage = 0;
    await type(">>> ПОДКЛЮЧЕНИЕ К ЗАКРЫТОМУ КРИПТО-КАНАЛУ...", "success");
    await type(">>> НАЖИМАЙТЕ [ENTER] ДЛЯ ФИКСАЦИИ ПОТОКОВ ДАННЫХ!", "gray"); await delay(500); nextStage();
}
function nextStage() {
    if (stage >= 3) { endKeyGame(); return; }
    const st = ["OPENING SECURE CRYPTO CHANNEL...", "DECRYPTING KEY STREAMS...", "PARSING BASE CODES..."];
    addLine(st[stage], "success"); const d = addLine("", "gray");
    gameInterval = setInterval(() => {
        let ch = "0123456789ABCDEFXYZ!@#%", hex = Array.from({length: 8}, () => ch[Math.floor(Math.random() * ch.length)]).join("");
        d.textContent = `[DECRYPT KEY FLOW #${stage + 1}]: ` + hex; playBeep(400, 'sine', 0.005);
    }, 60);
    DOM.inp.disabled = false; DOM.blk.classList.add('active'); DOM.inp.focus();
}
async function endKeyGame() {
    clearInterval(gameInterval); DOM.blk.classList.remove('active'); DOM.inp.disabled = true; await bar();
    await type(">>> РАСШИФРОВКА КЛЮЧЕЙ ЗАВЕРШЕНА.", "success");
    await type(">>> ГЛАВНЫЙ КЛЮЧ К БАЗАМ ДАННЫХ: ATLANTIS111", "success"); await delay(3500); showEmployeeMenu();
}
async function showEmployeeMenu() {
    await type("========================================", "gray");
    await type("ДОБРО ПОЖАЛОВАТЬ, " + CFG.LOGIN.toUpperCase() + "!", "success");
    await type("ВЫБЕРИТЕ ОПЦИЮ СИСТЕМЫ [1-2]:", "gray");
    await type("1. ПОСМОТРЕТЬ КЛЮЧИ К БАЗАМ ДАННЫХ", "success");
    await type("2. ВЫЙТИ ИЗ ТЕРМИНАЛА", "success");
    await type("========================================", "gray");
    ask('ВЫБЕРИТЕ ПУНКТ (1-2):', 'menu', false);
}
DOM.inp.oninput = () => { if(step !== 'game') DOM.view.textContent = isMask ? "*".repeat(DOM.inp.value.length) : DOM.inp.value; };
DOM.inp.onkeydown = async (e) => {
    if (e.key !== 'Enter') return;
    if (step === 'game') { clearInterval(gameInterval); playBeep(900, 'square', 0.1); addLine(">>> УЗЕЛ СЕГМЕНТА ЗАФИКСИРОВАН.", "success"); stage++; await delay(400); nextStage(); return; }
    const v = DOM.inp.value, cv = v.trim(); if (!v) return;

    if (cv.toLowerCase() === 'skip1' && step === 'speed_game') { clearTimeout(wordTimer); playBeep(880, 'sine', 0.2); addLine(">>> ЧИТ-КОД АКТИВИРОВАН: ОБХОД ФАЗЫ 1", "success"); successSpeedGame(); return; }
    if (cv.toLowerCase() === 'skip2' && step === 'phase2') { clearTimeout(wordTimer); playBeep(880, 'sine', 0.2); addLine(">>> ЧИТ-КОД АКТИВИРОВАН: ОБХОД ФАЗЫ 2", "success"); startPhaseThree(); return; }
    if (cv.toLowerCase() === 'skip3' && step === 'phase3') { clearTimeout(wordTimer); playBeep(880, 'sine', 0.2); addLine(">>> ЧИТ-КОД АКТИВИРОВАН: ОБХОД ФАЗЫ 3", "success"); startPhaseFour(); return; }
    if (cv.toLowerCase() === 'skip4' && step === 'phase4') { clearTimeout(wordTimer); playBeep(880, 'sine', 0.2); addLine(">>> ЧИТ-КОД АКТИВИРОВАН: ОБХОД ФАЗЫ 4", "success"); startPhaseFive(); return; }
    if (cv.toLowerCase() === 'skip5' && step === 'phase5') { clearTimeout(wordTimer); playBeep(880, 'sine', 0.2); addLine(">>> ЧИТ-КОД АКТИВИРОВАН: ОБХОД ФАЗЫ 5", "success"); startPhaseSix(); return; }
    if (cv.toLowerCase() === 'skip6' && step === 'phase6') { clearTimeout(wordTimer); playBeep(880, 'sine', 0.2); addLine(">>> ЧИТ-КОД АКТИВИРОВАН: ПОЛНЫЙ ВЗЛОМ", "success"); endAllGamesSuccess(); return; }

    if (step === 'speed_game') {
        if (cv.toUpperCase() === targetWord) { clearTimeout(wordTimer); playBeep(900, 'square', 0.1); addLine(">>> СЕГМЕНТ ОБХОДА СТАБИЛИЗИРОВАН.", "success"); stage++; await delay(400); nextSpeedWord(); }
        else die("КРИТИЧЕСКАЯ ОШИБКА ВВОДА! СИСТЕМА УНИЧТОЖЕНА."); return;
    }
    if (step === 'phase2') {
        if (cv.toUpperCase() === targetWord) { clearTimeout(wordTimer); playBeep(900, 'square', 0.1); addLine(">>> КОНТУР УЗЛА ПЕРЕХВАЧЕН И ПЕРЕНАПРАВЛЕН.", "success"); stage++; await delay(400); nextPhaseTwoNode(); }
        else die("СИНХРОНИЗАЦИЯ СОРВАНА! ШТАБ ПЕРЕХВАТИЛ СЕССИЮ."); return;
    }
    if (step === 'phase3') {
        if (cv === targetWord) { clearTimeout(wordTimer); playBeep(900, 'square', 0.1); addLine(">>> РЕЗОНАТОР ЯДРА СИНХРОНИЗИРОВАН.", "success"); stage++; await delay(400); nextPhaseThreeNode(); }
        else die("КОД НЕ СОВПАЛ! ЯДРО ПЕРЕГРЕЛОСЬ И ВСПЫХНУЛО."); return;
    }
       if (step === 'phase4') {
        if (cv.toUpperCase() === targetWord) { 
            clearTimeout(wordTimer); 
            playBeep(900, 'square', 0.1); 
            addLine(">>> ЧАСТОТНЫЙ ФИЛЬТР НАСТРОЕН.", "success"); 
            stage++; 
            await delay(400); 
            nextPhaseFourAudio(); 
        } else { 
            // Вместо старого die() теперь вызываем Скрамблера при ошибке ввода
            await scramblerDie(); 
        } 
        return;
    }
    if (step === 'phase5') {
        if (cv === targetWord) { clearTimeout(wordTimer); playBeep(900, 'square', 0.1); addLine(">>> АНОМАЛЬНЫЙ ПОТОК ФИЛЬТРОВАН.", "success"); stage++; await delay(400); nextPhaseFiveVirus(); }
        else die("ВВЕДЕН НЕ ТОТ ПОТОК! DDOS СМЁС СИСТЕМУ."); return;
    }
    if (step === 'phase6') {
        let chk = cv.toUpperCase() === "A" || cv.toUpperCase() === "А" ? "A" : (cv.toUpperCase() === "B" || cv.toUpperCase() === "Б" ? "B" : "");
        if (chk === targetWord) { clearTimeout(wordTimer); playBeep(900, 'square', 0.1); addLine(">>> ШЛЮЗ ПРОЙДЕН. ПАКЕТ ДВИЖЕТСЯ ДАЛЬШЕ.", "success"); stage++; await delay(400); nextPhaseSixRoute(); }
        else die("ПАКЕТ НАПРАВЛЕН В МЕРТВЫЙ ШЛЮЗ И УНИЧТОЖЕН."); return;
    }
    DOM.blk.classList.remove('active'); DOM.inp.disabled = true; addLine(DOM.pr.textContent + " " + (isMask ? "*".repeat(v.length) : cv), 'success'); await delay(300);
    if (step === 'login') {
        if (cv.toLowerCase() === 'base') { ask('ENTER DATABASE KEY:', 'base_key', true); }
        else if (cv.toLowerCase() === CFG.LOGIN) ask('ENTER PASSKEY:', 'pass', true);
        else { err("DENIED: UNKNOWN ID."); await delay(1000); ask('AGENT ID / EMPLOYEE:', 'login', false); }
    } else if (step === 'base_key') {
        if (cv === 'ATLANTIS111') startSpeedGame();
        else { err("ACCESS DENIED: INVALID DATABASE KEY."); await delay(1500); ask('AGENT ID / EMPLOYEE:', 'login', false); }
    } else if (step === 'pass') {
        if (cv === CFG.PASS) { await bar(); showEmployeeMenu(); }
        else { err("SECURITY VIOLATION. LOCKDOWN ENFORCED."); await delay(1500); ask('AGENT ID / EMPLOYEE:', 'login', false); }
    } else if (step === 'menu') {
        if (cv === '1') { startKeyGame(); } 
        else if (cv === '2') { await type(">>> ОТКЛЮЧЕНИЕ...", "gray"); await delay(1000); ask('AGENT ID / EMPLOYEE:', 'login', false); }
        else { err("НЕВЕРНЫЙ ВЫБОР."); await delay(1000); ask('ВЫБЕРИТЕ ПУНКТ (1-2):', 'menu', false); }
    }
};
document.onclick = () => DOM.inp.disabled || DOM.inp.focus(); window.onload = runBootLogs;
</script>
</body>
