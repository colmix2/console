<script>
    const CONFIG = {
        LOGIN: "Bill",
        PASSWORD: "324",
        SECRET_URL: "https://google.com",
        TYPE_SPEED: 15
    };

    // Продвинутый звуковой движок без внешних ресурсов
    const AudioEngine = {
        ctx: null,
        init() { 
            if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); 
        },
        playTone(freq, type, duration, volume) {
            this.init();
            if (this.ctx.state === 'suspended') this.ctx.resume();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        },
        beep() { this.playTone(800, 'square', 0.03, 0.02); },
        success() { 
            this.playTone(600, 'sine', 0.1, 0.05);
            setTimeout(() => this.playTone(900, 'sine', 0.15, 0.05), 80);
        },
        error() {
            this.playTone(120, 'sawtooth', 0.4, 0.1);
            setTimeout(() => this.playTone(90, 'sawtooth', 0.3, 0.1), 100);
        }
    };

    class Terminal {
        constructor() {
            this.dom = {
                screen: document.getElementById('screen'),
                input: document.getElementById('commandInput'),
                visualInput: document.getElementById('visualInput'),
                output: document.getElementById('output'),
                prompt: document.getElementById('prompt'),
                header: document.getElementById('headerText'),
                inputBlock: document.getElementById('inputLine')
            };
            this.currentStep = 'login';
            this.fakeDumpLogs = [
                "HEX: 0x4A 0xEF 0x12 0xBC -- MEMORY DUMP CORRUPTION DETECTED",
                "BYPASSING COMPLEX FIREWALL LAYER 3... SUCCESS",
                "STELTH_MOD: OVERRIDING CCTV MAIN FRAME... [DONE]",
                "SPOOFING IP: MAC ADDR 00:1A:2B:3C:4D:5E MASKED AS INT-INTERNAL",
                "DECRYPT_CORE: INJECTING PAYLOAD INTO SECURITY_SERVER.DLL",
                "CLEANING LOGS: /VAR/LOG/SECURE ERASED SUCCESSFULLY",
                "PROXY: HOPS ACTIVATED: REJKJAVIK -> SINGAPORE -> MILITARY_NET",
                "ANTIS_CYBER: BACKDOOR DETECTED ON PORT 8080 -- PURGING...",
                "SYS_LOCK: AGENT PERIMETER ARMED AND ENCRYPTED SHA-512",
                "WARN: INTRUSION ATTEMPT BLOCKED BY CAPP MODULE...",
                "DOC_STEALER: PRE-LOADING EXFILTRATION SCRIPTS..."
            ];
            this.introLines = [
                "SYS: BOOTING QUANTUM DECRYPTION CORES...",
                "SYS: ESTABLISHING REVERSE PROXY VIA ONION-OVERLAY... [TUNNEL STABLE]",
                "SYS: ANTI-CYBER ATTACK PARANOIA PROTOCOL (CAPP v9) IS ACTIVE.",
                "SYS: PACKET INJECTION COMPLETED. STANDING BY FOR AGENT AUTHENTICATION.\n"
            ];

            this.initEvents();
            this.runMatrixDump();
        }

        initEvents() {
            document.addEventListener('click', () => {
                if (!this.dom.input.disabled) this.dom.input.focus();
            });

            this.dom.input.addEventListener('input', () => {
                let val = this.dom.input.value;
                if (this.currentStep === 'password') {
                    this.dom.visualInput.textContent = '█'.repeat(val.length);
                } else {
                    this.dom.visualInput.textContent = val;
                }
                AudioEngine.beep();
            });

            this.dom.input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    this.handleCommand();
                }
            });
        }

        scroll() {
            this.dom.screen.scrollTo({
                top: this.dom.screen.scrollHeight,
                behavior: 'smooth'
            });
        }

        createLine(text, className = '') {
            const line = document.createElement('div');
            line.className = `output-line ${className}`;
            line.textContent = text;
            this.dom.output.appendChild(line);
            this.scroll();
            return line;
        }

        typeText(text, className = '', callback = null) {
            const line = this.createLine('', className);
            let i = 0;
            const printChar = () => {
                if (i < text.length) {
                    line.textContent += text.charAt(i);
                    i++;
                    AudioEngine.beep();
                    setTimeout(printChar, CONFIG.TYPE_SPEED);
                } else {
                    if (callback) callback();
                }
            };
            printChar();
        }

        runMatrixDump(count = 0, maxCount = 40) {
            this.dom.input.disabled = true;
            if (count < maxCount) {
                const log = this.fakeDumpLogs[Math.floor(Math.random() * this.fakeDumpLogs.length)];
                const hex = (Math.random() * 0xFFFFFF).toString(16).toUpperCase();
                this.createLine(`[DEBUG] ${log} // ADDR_VAL: 0x${hex}`);
                setTimeout(() => this.runMatrixDump(count + 1, maxCount), 15);
            } else {
                setTimeout(() => {
                    this.dom.output.innerHTML = '';
                    this.dom.header.style.display = 'block';
                    setTimeout(() => {
                        this.dom.header.style.opacity = '1';
                        this.playIntro(0);
                    }, 50);
                }, 600);
            }
        }

        playIntro(index) {
            if (index < this.introLines.length) {
                this.typeText(this.introLines[index], '', () => this.playIntro(index + 1));
            } else {
                this.dom.inputBlock.style.opacity = '1';
                this.enableInput();
            }
        }

        enableInput() {
            this.dom.input.disabled = false;
            this.dom.input.value = '';
            this.dom.visualInput.textContent = '';
            this.dom.input.focus();
        }

        showProgressBar(callback) {
            const line = this.createLine('', 'success-msg');
            let percent = 0;
            const updateBar = () => {
                if (percent <= 100) {
                    const size = 20;
                    const filled = Math.floor((percent / 100) * size);
                    const bar = '█'.repeat(filled) + '░'.repeat(size - filled);
                    line.textContent = `DECRYPTING STEALTH ARCHIVE: [${bar}] ${percent}%`;
                    percent += 5;
                    AudioEngine.beep();
                    setTimeout(updateBar, 50);
                } else if (callback) {
                    callback();
                }
            };
            updateBar();
        }

        handleCommand() {
            const value = this.dom.input.value.trim();
            if (!value) return;

            this.dom.input.disabled = true;

            if (this.currentStep === 'login') {
                this.createLine(`${this.dom.prompt.textContent} ${value}`, 'user-input-line');
                if (value.toLowerCase() === CONFIG.LOGIN.toLowerCase()) {
                    AudioEngine.success();
                    this.typeText("\n[OK] ИДЕНТИФИКАТОР АГЕНТА НАЙДЕН В СЕТИ. ПРОВЕРКА КРИПТО-ПОДПИСИ...", 'success-msg', () => {
                        this.currentStep = 'password';
                        this.dom.prompt.textContent = 'ENTER CRYPTO-KEY:';
                        this.dom.input.type = 'password';
                        this.enableInput();
                    });
                } else {
                    this.triggerError();
                }
            } else if (this.currentStep === 'password') {
                this.createLine(`${this.dom.prompt.textContent} ${'█'.repeat(value.length)}`, 'user-input-line');
                if (value === CONFIG.PASSWORD) {
                    AudioEngine.success();
                    this.typeText("\n[ACCESS GRANTED] ДОСТУП К ОПЕРАТИВНОЙ БАЗЕ ДАННЫХ РАЗРЕШЕН.\n", 'success-msg', () => {
                        this.showProgressBar(() => {
                            this.typeText("\nСКАЧИВАНИЕ ДОКУМЕНТОВ ИЗ КОМПЛЕКСА ЗАВЕРШЕНО. ПЕРЕНАПРАВЛЕНИЕ НА ЗАЩИЩЕННЫЙ КАНАЛ...", 'success-msg', () => {
                                setTimeout(() => { window.location.href = CONFIG.SECRET_URL; }, 1200);
                            });
                        });
                    });
                } else {
                    this.triggerError();
                }
            }
        }

        triggerError() {
            AudioEngine.error();
            this.typeText("\n[WARNING] ОТКАЗ В ДОСТУПЕ. ЗАПУСКАЮ СКРЫТИЕ СЛЕДОВ ТРАФИКА ДЛЯ ХОСТА...\n", 'error-msg', () => {
                this.currentStep = 'login';
                this.dom.prompt.textContent = 'ENTER AGENT ID:';
                this.dom.input.type = 'text';
                this.enableInput();
            });
        }
    }

    // Корректный запуск после полной загрузки DOM структуры
    window.addEventListener('DOMContentLoaded', () => {
        new Terminal();
    });
</script>
