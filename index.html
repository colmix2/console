<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLANTIS // TERMINAL</title>
    <style>
        body {
            background: #010502; color: #00ff41;
            font-family: monospace; font-size: 16px;
            padding: 30px; margin: 0; min-height: 100vh;
        }
        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.02), rgba(0,255,0,0.01), rgba(0,0,255,0.02));
            z-index: 99; background-size: 100% 4px, 6px 100%; pointer-events: none;
        }
        .terminal { max-width: 800px; margin: 0 auto; }
        .header { color: #55ff55; border-bottom: 2px double #00ff41; padding-bottom: 10px; margin-bottom: 20px; white-space: pre-wrap; display: none; }
        .line { line-height: 1.5; margin-bottom: 4px; word-break: break-all; white-space: pre-wrap; }
        .input-line { display: flex; align-items: center; margin-top: 15px; opacity: 0; transition: opacity 0.3s; }
        .prompt { margin-right: 10px; color: #55ff55; font-weight: bold; }
        input { background: transparent; border: none; color: #fff; font-family: monospace; font-size: 16px; outline: none; flex-grow: 1; }
        .error { color: #ff1111; font-weight: bold; }
        .success { color: #00ffff; }
    </style>
</head>
<body>
<div class="terminal">
    <div class="header" id="hd">======================================================================
  P.M.C. "ATLANTIS" // INFILTRATION & STEALTH OPERATIONS NETWORK
======================================================================</div>
    <div id="out"></div>
    <div class="input-line" id="inBlock">
        <span class="prompt" id="pr">AGENT ID:</span>
        <input type="text" id="inp" autocomplete="off" disabled>
    </div>
</div>
<script>
    const CONFIG = { LOGIN: "Bill", PASS: "324", URL: "https://google.com", SPEED: 10 };
    const DOM = { inp: document.getElementById('inp'), out: document.getElementById('out'), pr: document.getElementById('pr'), hd: document.getElementById('hd'), blk: document.getElementById('inBlock') };
    let step = 'login';

    document.addEventListener('click', () => { if(!DOM.inp.disabled) DOM.inp.focus(); });
    
    function addLine(txt, cls = '') {
        const d = document.createElement('div'); d.className = `line ${cls}`; d.textContent = txt;
        DOM.out.appendChild(d); window.scrollTo(0, document.body.scrollHeight); return d;
    }
    
    function type(txt, cls = '', cb = null) {
        const d = addLine('', cls); let i = 0;
        function p() { if(i < txt.length){ d.textContent += txt.charAt(i++); setTimeout(p, CONFIG.SPEED); } else if(cb) cb(); } p();
    }

    const logs = ["BYPASSING FIREWALL... SUCCESS", "STEALTH_MOD: CCTV OVERRIDE... [DONE]", "SPOOFING IP... INT-INTERNAL", "CLEANING LOGS... ERASED", "ANTI-CYBER ATTACK PROTOCOL ACTIVE."];
    
    function runLogs(c = 0) {
        if (c < 25) {
            addLine(`[DEBUG] ${logs[Math.floor(Math.random() * logs.length)]} // ${performance.now().toFixed(1)}ms`);
            setTimeout(() => runLogs(c + 1), c > 15 ? 5 : 15);
        } else {
            DOM.out.innerHTML = ''; DOM.hd.style.display = 'block';
            type("SYS: ESTABLISHING PROXY TUNNEL... STANDING BY FOR AGENT.", "success", () => ask('ENTER AGENT ID:', 'login'));
        }
    }

    function ask(p, s, t = 'text') {
        step = s; DOM.pr.textContent = p; DOM.inp.value = ''; DOM.inp.type = t;
        DOM.blk.style.opacity = '1'; DOM.inp.disabled = false; DOM.inp.focus();
    }

    function bar(cb) {
        const d = addLine('', 'success'); let p = 0;
        function u() { if(p <= 100){ d.textContent = `DECRYPTING: [${'█'.repeat(p/5)}${'░'.repeat(20-p/5)}] ${p}%`; p += 5; setTimeout(u, 30); } else cb(); } u();
    }

    DOM.inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const v = DOM.inp.value.trim(); if (!v) return;
            DOM.blk.style.opacity = '0'; DOM.inp.disabled = true;
            addLine(`${DOM.pr.textContent} ${step === 'pass' ? '****' : v}`, 'success');
            
            if (step === 'login') {
                if (v === CONFIG.LOGIN) setTimeout(() => ask('ENTER PASSKEY:', 'pass', 'password'), 300);
                else { addLine("ACCESS DENIED.", "error"); setTimeout(() => ask('ENTER AGENT ID:', 'login'), 1000); }
            } else {
                if (v === CONFIG.PASS) {
                    bar(() => { addLine("REDIRECTING...", "success"); setTimeout(() => window.location.href = CONFIG.URL, 800); });
                } else { addLine("SECURITY VIOLATION.", "error"); setTimeout(() => ask('ENTER AGENT ID:', 'login'), 1200); }
            }
        }
    });

    window.onload = runLogs;
</script>
</body>
</html>
